version: "2"

run:
  timeout: 5m
  go: "1.22"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - nolintlint
    - errname
    - errorlint
    - gocritic
    - revive
    - bodyclose
    - contextcheck
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
    errcheck:
      check-type-assertions: true
      check-blank: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
