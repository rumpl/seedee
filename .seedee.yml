pipeline:
  name: my-app-ci
  env:
    GO_VERSION: "1.22"
    CGO_ENABLED: "0"
  jobs:
    build:
      image: golang:1.22
      env:
        GOOS: linux
        GOARCH: amd64
      steps:
        - name: Download dependencies
          run: go mod download
        - name: Build binary
          run: go build -o /workspace/bin/app ./cmd/app
    test:
      image: golang:1.22
      depends_on:
        - build
      steps:
        - name: Run unit tests
          run: go test -v -race ./...
        - name: Run integration tests
          run: go test -v -tags=integration ./...
    lint:
      image: golangci/golangci-lint:latest
      steps:
        - name: Run linter
          run: golangci-lint run ./...
    deploy:
      image: alpine:latest
      depends_on:
        - test
        - lint
      steps:
        - name: Deploy
          run: echo "Deploying..."
          env:
            DEPLOY_TOKEN: "${DEPLOY_TOKEN}"
