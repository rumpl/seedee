pipeline:
  name: seedee-ci
  env:
    CGO_ENABLED: "0"
    GOFLAGS: "-mod=mod"
  jobs:
    lint:
      image: golangci/golangci-lint:latest
      steps:
        - name: Download dependencies
          run: cd /workspace && go mod download
        - name: Run linter
          run: cd /workspace && golangci-lint run ./...
    test:
      image: golang:1.26
      steps:
        - name: Run unit tests
          run: cd /workspace && go test ./...
    build:
      image: golang:1.26
      depends_on:
        - test
      steps:
        - name: Build binaries
          run: cd /workspace && go build -buildvcs=false -o /workspace/bin/seedee ./cmd/seedee && go build -buildvcs=false -o /workspace/bin/seedeed ./cmd/seedeed
